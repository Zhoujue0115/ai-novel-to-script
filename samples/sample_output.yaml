    title: "迟到的解释"
    chapter_refs: [3]
    location: "老街咖啡馆"
    time: "夜晚"
    summary: "林夏解释三年前离开的原因，周言给予安慰"
    characters_in_scene: ["c1", "c2"]
    beats:
      - type: "dialogue"
        character: "c2"
        content: "三年前你为什么要走？"
      - type: "stage_direction"
        content: "周言的声音很轻，但问题却重重地砸在林夏心上"
      - type: "action"
        character: "c1"
        content: "林夏低下头，咖啡的热气模糊了她的视线"
      - type: "dialogue"
        character: "c1"
        content: "那时候我觉得自己配不上你。我刚丢了工作，父亲又病重……我不想拖累你。"
      - type: "action"
        character: "c1"
        content: "她深吸一口气，眼角有些湿润"
      - type: "dialogue"
        character: "c1"
        content: "我知道这样说很自私。但当时我真的不知道该怎么办。"
      - type: "action"
        character: "c2"
        content: "周言没有说话，他把手伸过桌面，轻轻覆住了她的手"
      - type: "narration"
        content: "咖啡馆里的爵士乐悠然地流淌着，雨还在下，但好像不再那么冷了"

