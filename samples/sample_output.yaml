        content: "她望着窗外，雨水顺着玻璃窗滑下来，把街景切割成模糊的碎片"

  - scene_id: "s3"
    title: "旧人重逢"
    chapter_refs: [2]
    location: "老街咖啡馆"
    time: "夜晚"
    summary: "周言推开咖啡馆门，与林夏重逢"
    characters_in_scene: ["c1", "c2"]
    beats:
      - type: "action"
        character: "c2"
        content: "咖啡馆的门被推开"
      - type: "dialogue"
        character: "c2"
        content: "好久不见。"
      - type: "action"
        character: "c1"
        content: "林夏抬起头，看见了周言"
      - type: "narration"
        content: "他和三年前没有太大变化，只是眉宇间多了几分沉稳"
      - type: "action"
        character: "c1"
        content: "林夏的手指不自觉收紧了杯柄，心跳漏了一拍"
      - type: "dialogue"
        character: "c1"
        content: "我没想到会在这里遇见你。"
      - type: "stage_direction"
        content: "林夏的声音有些发干"
      - type: "action"
        character: "c2"
        content: "周言在她对面坐下"
      - type: "dialogue"
        character: "c2"
        content: "我经常来这里。这三年，一直没有变。"
      - type: "action"
        character: "c2"
        content: "他望向窗外，目光像是穿越了雨幕，落回过去"

